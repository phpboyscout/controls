# Curated navigation, ordered by the Diátaxis quadrants (tutorial → how-to →
# explanation → reference). Without this, the sidebar auto-generates
# alphabetically; the order below is pedagogical.
nav = [
  { Home = "index.md" },
  { Tutorials = [ { "Getting started" = "tutorials/getting-started.md" }, { "Supervise workers that come and go" = "tutorials/supervise-workers.md" } ] },
  { "How-to guides" = [ { "Register & run services" = "how-to/register-services.md" }, { "Add health checks" = "how-to/health-checks.md" }, { "Configure restart policy" = "how-to/restart-policy.md" }, { "Handle graceful shutdown & signals" = "how-to/graceful-shutdown.md" }, { "Survive a restart" = "how-to/survive-a-restart.md" }, { "Find a capture a restart cannot reuse" = "how-to/lint-single-use-captures.md" }, { "Test services & mock the controller" = "how-to/testing.md" } ] },
  { Explanation = [ { "Architecture & the lifecycle state machine" = "explanation/architecture.md" }, { "Health, liveness & readiness" = "explanation/health-model.md" }, { "The restart supervisor" = "explanation/restart-supervisor.md" }, { "Concurrency & shutdown correctness" = "explanation/concurrency.md" }, { "Registered means required" = "explanation/supervision.md" }, { "What controls does not do" = "explanation/limitations.md" } ] },
  { Reference = [ { Overview = "reference/index.md" }, { Controller = "reference/controller.md" }, { "Services & restart policy" = "reference/services.md" }, { Generational = "reference/generational.md" }, { "Health checks & reports" = "reference/health.md" }, { "Defaults & timings" = "reference/defaults.md" }, { Interfaces = "reference/interfaces.md" } ] },
]

[project]
site_name = "controls"
site_description = "Service-lifecycle supervisor for Go: concurrent startup, health probes, ordered shutdown, self-healing restarts"
site_author = "Matt Cockayne"
site_url = "https://controls.go.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/go/controls"
repo_name = "phpboyscout/go/controls"
copyright = "Copyright &copy; 2026 Matt Cockayne"

[project.theme]
logo = "images/branding/logo_transparent.svg"
favicon = "images/branding/favicon.svg"
language = "en"
features = [
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

